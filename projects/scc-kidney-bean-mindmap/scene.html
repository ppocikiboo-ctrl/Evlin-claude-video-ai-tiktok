<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>SCC Mind Map Scene</title>
<style>
  @font-face { font-family: "Fredoka"; font-weight: 600; src: url("fonts/fredoka-latin-600-normal.woff2") format("woff2"); }
  @font-face { font-family: "Fredoka"; font-weight: 700; src: url("fonts/fredoka-latin-700-normal.woff2") format("woff2"); }
  html, body { margin: 0; padding: 0; background: #000; overflow: hidden; }
  canvas { display: block; }
</style>
</head>
<body>
<canvas id="c" width="1080" height="1920"></canvas>
<script>
// Deterministic frame renderer: window.renderFrame(t) draws the frame at time t (seconds).
// Footage frames are read from frames/src_XXXX.jpg (30 fps, extracted by build.sh).
const W = 1080, H = 1920;
const cv = document.getElementById("c");
const ctx = cv.getContext("2d");
const FONT = '"Fredoka", "Noto Color Emoji", sans-serif';
const EMOJI = '"Noto Color Emoji"';
let TL = null;
const SRC_FPS = 30, SRC_LAST = 344;

const C = {
  purple: "#9B5CFF", deepPurple: "#5B2A9E", lilac: "#D9C2FF", lavender: "#EBDDFF",
  pink: "#FF7EB9", hotPink: "#FF4F9A", softPink: "#FFD3E8", cream: "#FFF6E6",
  gold: "#FFC94D", goldDeep: "#E89B1E", white: "#FFFFFF",
};

// ---------- utilities ----------
const clamp = (v, a = 0, b = 1) => Math.max(a, Math.min(b, v));
const lerp = (a, b, k) => a + (b - a) * k;
const prog = (t, t0, d) => clamp((t - t0) / d);
const easeOutBack = (k, s = 1.9) => { k -= 1; return k * k * ((s + 1) * k + s) + 1; };
const easeOutCubic = k => 1 - Math.pow(1 - k, 3);
const easeInOutCubic = k => k < 0.5 ? 4 * k * k * k : 1 - Math.pow(-2 * k + 2, 3) / 2;
const easeOutElastic = k => k === 0 ? 0 : k === 1 ? 1 : Math.pow(2, -10 * k) * Math.sin((k * 10 - 0.75) * (2 * Math.PI) / 3) + 1;
function popScale(t, t0, d = 0.45) { const k = prog(t, t0, d); return k <= 0 ? 0 : easeOutBack(k, 2.4); }
function rng(seed) { return function () { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let x = Math.imul(seed ^ seed >>> 15, 1 | seed); x = x + Math.imul(x ^ x >>> 7, 61 | x) ^ x; return ((x ^ x >>> 14) >>> 0) / 4294967296; }; }

function roundRect(x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y); ctx.lineTo(x + w - r, y); ctx.quadraticCurveTo(x + w, y, x + w, y + r);
  ctx.lineTo(x + w, y + h - r); ctx.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
  ctx.lineTo(x + r, y + h); ctx.quadraticCurveTo(x, y + h, x, y + h - r);
  ctx.lineTo(x, y + r); ctx.quadraticCurveTo(x, y, x + r, y); ctx.closePath();
}
function starPath(x, y, r, inner = 0.42, n = 4, rot = 0) {
  ctx.beginPath();
  for (let i = 0; i < n * 2; i++) {
    const a = rot + i * Math.PI / n - Math.PI / 2;
    const rr = i % 2 === 0 ? r : r * inner;
    ctx.lineTo(x + Math.cos(a) * rr, y + Math.sin(a) * rr);
  }
  ctx.closePath();
}
function heartPath(x, y, s) {
  ctx.beginPath();
  ctx.moveTo(x, y + s * 0.35);
  ctx.bezierCurveTo(x - s * 1.1, y - s * 0.35, x - s * 0.55, y - s * 1.05, x, y - s * 0.5);
  ctx.bezierCurveTo(x + s * 0.55, y - s * 1.05, x + s * 1.1, y - s * 0.35, x, y + s * 0.35);
  ctx.closePath();
}
function drawHeart(x, y, s, col = C.hotPink, alpha = 1) {
  ctx.save(); ctx.globalAlpha *= alpha;
  heartPath(x, y, s);
  const g = ctx.createRadialGradient(x - s * 0.3, y - s * 0.55, s * 0.05, x, y - s * 0.2, s * 1.1);
  g.addColorStop(0, "#FFE1EF"); g.addColorStop(0.35, col); g.addColorStop(1, "#C42A6E");
  ctx.fillStyle = g; ctx.shadowColor = "rgba(160,40,110,0.35)"; ctx.shadowBlur = s * 0.4; ctx.shadowOffsetY = s * 0.12;
  ctx.fill();
  ctx.shadowColor = "transparent";
  ctx.beginPath(); ctx.ellipse(x - s * 0.42, y - s * 0.55, s * 0.18, s * 0.11, -0.6, 0, Math.PI * 2);
  ctx.fillStyle = "rgba(255,255,255,0.85)"; ctx.fill();
  ctx.restore();
}
function drawSparkle(x, y, r, col = C.gold, alpha = 1, rot = 0) {
  if (r <= 0.5) return;
  ctx.save(); ctx.globalAlpha *= alpha;
  ctx.shadowColor = col; ctx.shadowBlur = r * 1.2;
  starPath(x, y, r, 0.32, 4, rot);
  const g = ctx.createRadialGradient(x, y, 0, x, y, r);
  g.addColorStop(0, "#FFFFFF"); g.addColorStop(0.45, col); g.addColorStop(1, col);
  ctx.fillStyle = g; ctx.fill();
  ctx.restore();
}
function drawStar5(x, y, r, alpha = 1, rot = 0) {
  ctx.save(); ctx.globalAlpha *= alpha;
  starPath(x, y, r, 0.5, 5, rot);
  const g = ctx.createRadialGradient(x - r * 0.3, y - r * 0.3, r * 0.1, x, y, r);
  g.addColorStop(0, "#FFF6C8"); g.addColorStop(0.5, C.gold); g.addColorStop(1, C.goldDeep);
  ctx.fillStyle = g; ctx.shadowColor = "rgba(200,120,0,0.4)"; ctx.shadowBlur = r * 0.4; ctx.shadowOffsetY = r * 0.1;
  ctx.fill(); ctx.restore();
}
function emoji(ch, x, y, size, rot = 0, alpha = 1, shadow = true) {
  ctx.save(); ctx.globalAlpha *= alpha;
  ctx.translate(x, y); ctx.rotate(rot);
  ctx.font = `${size}px ${EMOJI}`; ctx.textAlign = "center"; ctx.textBaseline = "middle";
  if (shadow) { ctx.shadowColor = "rgba(90,30,120,0.35)"; ctx.shadowBlur = size * 0.18; ctx.shadowOffsetY = size * 0.08; }
  ctx.fillText(ch, 0, 0);
  ctx.restore();
}

// 3D cartoon text: extruded depth layers + thick outline + glossy fill.
function text3D(str, x, y, size, opt = {}) {
  const fill = opt.fill || [C.white, "#FFF1FA"];
  const stroke = opt.stroke || C.deepPurple;
  const depthCol = opt.depth || "#3E1677";
  const depth = opt.depthPx != null ? opt.depthPx : size * 0.09;
  ctx.save();
  ctx.font = `700 ${size}px ${FONT}`; ctx.textAlign = opt.align || "center"; ctx.textBaseline = "middle";
  ctx.lineJoin = "round"; ctx.miterLimit = 2;
  const sw = size * (opt.strokeK || 0.16);
  ctx.shadowColor = "rgba(60,10,90,0.35)"; ctx.shadowBlur = size * 0.25; ctx.shadowOffsetY = size * 0.12;
  for (let i = Math.ceil(depth); i >= 1; i--) {
    ctx.lineWidth = sw; ctx.strokeStyle = depthCol; ctx.fillStyle = depthCol;
    ctx.strokeText(str, x, y + i); ctx.fillText(str, x, y + i);
    if (i === Math.ceil(depth)) ctx.shadowColor = "transparent";
  }
  ctx.shadowColor = "transparent";
  ctx.lineWidth = sw; ctx.strokeStyle = stroke; ctx.strokeText(str, x, y);
  const g = ctx.createLinearGradient(0, y - size * 0.5, 0, y + size * 0.5);
  g.addColorStop(0, fill[0]); g.addColorStop(1, fill[1]);
  ctx.fillStyle = g; ctx.fillText(str, x, y);
  // gloss highlight on top half
  ctx.save();
  ctx.beginPath(); ctx.rect(0, y - size * 0.55, W, size * 0.32); ctx.clip();
  ctx.globalAlpha = 0.35; ctx.fillStyle = "#FFFFFF"; ctx.fillText(str, x, y);
  ctx.restore();
  ctx.restore();
}
function fitSize(str, size, maxW, weight = 700) {
  ctx.save(); ctx.font = `${weight} ${size}px ${FONT}`;
  const w = ctx.measureText(str).width; ctx.restore();
  return w > maxW ? size * maxW / w : size;
}

// Cute rounded bubble with glossy 3D look. Returns nothing; draws centred at x,y.
function bubble(lines, x, y, size, opt = {}) {
  ctx.save();
  ctx.font = `700 ${size}px ${FONT}`;
  const lh = size * 1.12;
  let tw = 0; for (const l of lines) tw = Math.max(tw, ctx.measureText(l).width);
  const padX = size * 0.75, padY = size * 0.45;
  const bw = tw + padX * 2, bh = lh * lines.length + padY * 2;
  const r = Math.min(bh / 2, size * 1.1);
  const bx = x - bw / 2, by = y - bh / 2;
  if (opt.glow) { ctx.shadowColor = opt.glow; ctx.shadowBlur = opt.glowBlur || 50; }
  else { ctx.shadowColor = "rgba(110,40,160,0.35)"; ctx.shadowBlur = 30; ctx.shadowOffsetY = 12; }
  // bottom "3D" rim
  roundRect(bx, by + size * 0.14, bw, bh, r); ctx.fillStyle = opt.rim || "#C79BFF"; ctx.fill();
  ctx.shadowColor = "transparent"; ctx.shadowBlur = 0; ctx.shadowOffsetY = 0;
  roundRect(bx, by, bw, bh, r);
  const g = ctx.createLinearGradient(0, by, 0, by + bh);
  const f = opt.fill || ["#FFFFFF", "#FFEFF8"];
  g.addColorStop(0, f[0]); g.addColorStop(1, f[1]);
  ctx.fillStyle = g; ctx.fill();
  ctx.lineWidth = size * 0.12; ctx.strokeStyle = opt.border || C.pink; ctx.stroke();
  // gloss
  ctx.save(); roundRect(bx, by, bw, bh, r); ctx.clip();
  ctx.beginPath(); ctx.ellipse(x, by + bh * 0.08, bw * 0.46, bh * 0.28, 0, 0, Math.PI * 2);
  ctx.fillStyle = "rgba(255,255,255,0.45)"; ctx.fill(); ctx.restore();
  ctx.textAlign = "center"; ctx.textBaseline = "middle";
  for (let i = 0; i < lines.length; i++) {
    const ly = by + padY + lh * (i + 0.5) + size * 0.04;
    if (opt.textStroke) { ctx.lineJoin = "round"; ctx.lineWidth = size * 0.16; ctx.strokeStyle = opt.textStroke; ctx.strokeText(lines[i], x, ly); }
    ctx.fillStyle = opt.color || C.deepPurple; ctx.fillText(lines[i], x, ly);
  }
  ctx.restore();
  return { w: bw, h: bh };
}

// ---------- backgrounds & particles ----------
function pastelBg(t, warm = 0) {
  const g = ctx.createLinearGradient(0, 0, 0, H);
  g.addColorStop(0, "#E6D4FF"); g.addColorStop(0.5, warm ? "#FFDDF0" : "#F6DDFB"); g.addColorStop(1, "#FFF1DE");
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
  // rotating soft light rays
  ctx.save(); ctx.translate(W / 2, H * 0.42); ctx.rotate(t * 0.12);
  for (let i = 0; i < 16; i++) {
    ctx.rotate(Math.PI / 8);
    ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(-90, -1500); ctx.lineTo(90, -1500); ctx.closePath();
    ctx.fillStyle = i % 2 ? "rgba(255,255,255,0.13)" : "rgba(255,255,255,0.04)"; ctx.fill();
  }
  ctx.restore();
  // bokeh
  const R = rng(7);
  for (let i = 0; i < 22; i++) {
    const bx = R() * W, by0 = R() * H, rr = 20 + R() * 70, sp = 15 + R() * 30;
    const by = ((by0 - t * sp) % (H + 200) + H + 200) % (H + 200) - 100;
    const col = [C.lilac, C.softPink, "#FFF0C2", "#FFFFFF"][i % 4];
    const gg = ctx.createRadialGradient(bx, by, 0, bx, by, rr);
    gg.addColorStop(0, col); gg.addColorStop(1, "rgba(255,255,255,0)");
    ctx.globalAlpha = 0.55; ctx.fillStyle = gg; ctx.beginPath(); ctx.arc(bx, by, rr, 0, Math.PI * 2); ctx.fill();
  }
  ctx.globalAlpha = 1;
}
function ambientSparkles(t, seed, n, region = [0, 0, W, H]) {
  const R = rng(seed);
  for (let i = 0; i < n; i++) {
    const x = region[0] + R() * region[2], y = region[1] + R() * region[3];
    const ph = R() * 6.28, sp = 2 + R() * 3, sz = 8 + R() * 16;
    const k = Math.max(0, Math.sin(t * sp + ph));
    drawSparkle(x, y - (t * 10 % 40), sz * k, i % 3 ? C.gold : "#FFFFFF", 0.9 * k, t * 0.5);
  }
}
function floatingHearts(t, seed, n) {
  const R = rng(seed);
  for (let i = 0; i < n; i++) {
    const x0 = R() * W, sp = 60 + R() * 70, ph = R() * 30, s = 14 + R() * 22;
    const y = H + 60 - ((t + ph) * sp) % (H + 160);
    const x = x0 + Math.sin((t + ph) * 1.6) * 30;
    drawHeart(x, y, s, i % 2 ? C.hotPink : "#C38BFF", 0.75);
  }
}
// Timed star "TING" flashes from timeline.json
function starFlashes(t) {
  for (const s of TL.stars) {
    const k = (t - s.t) / 0.7;
    if (k < 0 || k > 1) continue;
    const sc = k < 0.25 ? easeOutBack(k / 0.25) : 1 - (k - 0.25) / 0.75;
    drawSparkle(s.x, s.y, 70 * sc, "#FFE38A", 1, k * 1.2);
    drawSparkle(s.x, s.y, 140 * sc * 0.5, "#FFFFFF", 0.6 * (1 - k), -k);
    for (let j = 0; j < 6; j++) {
      const a = j * Math.PI / 3 + 0.3, d = 40 + 90 * easeOutCubic(k);
      drawSparkle(s.x + Math.cos(a) * d, s.y + Math.sin(a) * d, 14 * (1 - k), C.pink, 1 - k);
    }
  }
}
function burst(t, t0, x, y, maxR, count = 14, cols = [C.gold, C.pink, "#FFFFFF", C.purple]) {
  const k = (t - t0) / 0.8;
  if (k < 0 || k > 1) return;
  const R = rng(Math.floor(t0 * 100) + count);
  for (let i = 0; i < count; i++) {
    const a = (i / count) * Math.PI * 2 + R() * 0.4, d = maxR * (0.4 + R() * 0.6) * easeOutCubic(k);
    const px = x + Math.cos(a) * d, py = y + Math.sin(a) * d;
    if (i % 3 === 0) drawHeart(px, py, 16 * (1 - k) + 4, C.hotPink, 1 - k);
    else drawSparkle(px, py, 22 * (1 - k * 0.8), cols[i % cols.length], 1 - k, k * 3);
  }
  ctx.save(); ctx.globalAlpha = 0.6 * (1 - k); ctx.lineWidth = 10 * (1 - k);
  ctx.strokeStyle = "#FFFFFF"; ctx.beginPath(); ctx.arc(x, y, maxR * 0.9 * easeOutCubic(k), 0, Math.PI * 2); ctx.stroke();
  ctx.restore();
}

// ---------- footage ----------
const imgCache = new Map();
function loadImg(src) {
  if (imgCache.has(src)) return imgCache.get(src);
  const p = new Promise((res, rej) => { const im = new Image(); im.onload = () => res(im); im.onerror = rej; im.src = src; });
  imgCache.set(src, p);
  if (imgCache.size > 12) imgCache.delete(imgCache.keys().next().value);
  return p;
}
function srcTime(t) {
  if (t < 6.67) return clamp(2.55 + (t - 3.5) * 0.74, 2.55, 4.9);
  if (t < 10) return 6.4 + (t - 6.67);
  return Math.min(9.9 + (t - 10) * 0.5, 11.42);
}
function frameUrl(st) {
  const idx = Math.min(SRC_LAST, Math.max(1, Math.floor(st * SRC_FPS) + 1));
  return `frames/src_${String(idx).padStart(4, "0")}.jpg`;
}
// draw footage inside a framed rounded card (with optional source crop)
function footageCard(img, cx, cy, w, h, opt = {}) {
  const crop = opt.crop || [0, 0, img.width, img.height];
  const r = opt.r || 46;
  ctx.save();
  ctx.translate(cx, cy); ctx.rotate(opt.rot || 0); ctx.scale(opt.scale || 1, opt.scale || 1);
  // glow + white frame
  ctx.shadowColor = opt.glow || "rgba(155,92,255,0.55)"; ctx.shadowBlur = 60; ctx.shadowOffsetY = 18;
  roundRect(-w / 2 - 14, -h / 2 - 14, w + 28, h + 28, r + 12);
  const fg = ctx.createLinearGradient(0, -h / 2, 0, h / 2);
  fg.addColorStop(0, "#FFFFFF"); fg.addColorStop(1, "#FFE3F2");
  ctx.fillStyle = fg; ctx.fill();
  ctx.shadowColor = "transparent";
  ctx.lineWidth = 6; ctx.strokeStyle = C.pink; ctx.stroke();
  roundRect(-w / 2, -h / 2, w, h, r); ctx.save(); ctx.clip();
  ctx.drawImage(img, crop[0], crop[1], crop[2], crop[3], -w / 2, -h / 2, w, h);
  ctx.restore();
  ctx.restore();
}

// ---------- characters ----------
// Chibi girl. mood: "worried" | "happy". k = shake/excite amount.
function drawGirl(x, y, s, t, mood, opt = {}) {
  ctx.save(); ctx.translate(x, y); ctx.scale(s, s);
  const hair = ctx.createLinearGradient(0, -150, 0, 220);
  hair.addColorStop(0, "#6B3E7A"); hair.addColorStop(1, "#3B1D4A");
  const skin = ctx.createRadialGradient(-25, -20, 10, 0, 10, 115);
  skin.addColorStop(0, "#FFF0E6"); skin.addColorStop(0.7, "#FFD9C6"); skin.addColorStop(1, "#F2B9A2");
  const body = !opt.headOnly;
  // hair back
  ctx.fillStyle = hair;
  if (body) { roundRect(-128, -40, 256, 270, 90); ctx.fill(); }
  ctx.beginPath(); ctx.ellipse(0, -5, 126, 128, 0, 0, Math.PI * 2); ctx.fill();
  // buns with bows
  for (const sx of [-1, 1]) {
    ctx.beginPath(); ctx.arc(sx * 98, -102, 46, 0, Math.PI * 2); ctx.fillStyle = hair; ctx.fill();
    ctx.beginPath(); ctx.arc(sx * 90, -116, 16, 0, Math.PI * 2); ctx.fillStyle = "rgba(255,255,255,0.18)"; ctx.fill();
  }
  if (body) {
    // torso (sweater)
    const sw = ctx.createLinearGradient(-150, 0, 150, 0);
    sw.addColorStop(0, "#FF9CCB"); sw.addColorStop(0.5, "#FFC2DF"); sw.addColorStop(1, "#F27DB5");
    ctx.beginPath(); ctx.moveTo(-70, 95); ctx.quadraticCurveTo(-160, 110, -175, 330); ctx.lineTo(175, 330);
    ctx.quadraticCurveTo(160, 110, 70, 95); ctx.closePath(); ctx.fillStyle = sw; ctx.fill();
    // collar
    ctx.beginPath(); ctx.moveTo(-48, 98); ctx.quadraticCurveTo(0, 150, 48, 98); ctx.lineWidth = 12; ctx.strokeStyle = "#FFFFFF"; ctx.stroke();
    // neck
    ctx.fillStyle = "#F7C7B2"; roundRect(-22, 70, 44, 36, 14); ctx.fill();
  }
  // face
  ctx.beginPath(); ctx.ellipse(0, 0, 104, 98, 0, 0, Math.PI * 2); ctx.fillStyle = skin; ctx.fill();
  // bangs (scalloped)
  ctx.beginPath(); ctx.moveTo(-112, 10);
  ctx.bezierCurveTo(-120, -95, -60, -125, 0, -122); ctx.bezierCurveTo(60, -125, 120, -95, 112, 10);
  ctx.quadraticCurveTo(95, -35, 70, -38); ctx.quadraticCurveTo(52, -20, 38, -42);
  ctx.quadraticCurveTo(15, -22, 0, -46); ctx.quadraticCurveTo(-15, -22, -38, -42);
  ctx.quadraticCurveTo(-52, -20, -70, -38); ctx.quadraticCurveTo(-95, -35, -112, 10); ctx.closePath();
  ctx.fillStyle = hair; ctx.fill();
  ctx.beginPath(); ctx.arc(0, -40, 92, Math.PI * 1.15, Math.PI * 1.55); ctx.lineWidth = 9; ctx.strokeStyle = "rgba(255,255,255,0.28)"; ctx.lineCap = "round"; ctx.stroke();
  // bow
  ctx.save(); ctx.translate(70, -105); ctx.rotate(0.3);
  for (const sx of [-1, 1]) { ctx.beginPath(); ctx.ellipse(sx * 20, 0, 22, 14, sx * 0.3, 0, Math.PI * 2); ctx.fillStyle = C.hotPink; ctx.fill(); }
  ctx.beginPath(); ctx.arc(0, 0, 9, 0, Math.PI * 2); ctx.fillStyle = "#FF8FC0"; ctx.fill(); ctx.restore();
  // eyes
  const blink = (t % 2.7) > 2.6 ? 0.15 : 1;
  for (const sx of [-1, 1]) {
    const ex = sx * 42, ey = 14;
    if (mood === "happy") {
      ctx.beginPath(); ctx.arc(ex, ey + 6, 18, Math.PI * 1.1, Math.PI * 1.9); ctx.lineWidth = 8; ctx.strokeStyle = "#2B1B3A"; ctx.lineCap = "round"; ctx.stroke();
    } else {
      const ry = (opt.wide ? 30 : 26) * blink;
      ctx.beginPath(); ctx.ellipse(ex, ey, 21, ry, 0, 0, Math.PI * 2);
      const eg = ctx.createLinearGradient(0, ey - ry, 0, ey + ry); eg.addColorStop(0, "#1E1030"); eg.addColorStop(1, "#7A4BB8");
      ctx.fillStyle = eg; ctx.fill();
      if (blink > 0.5) {
        ctx.fillStyle = "#FFFFFF"; ctx.beginPath(); ctx.arc(ex + 7, ey - 10, 8, 0, Math.PI * 2); ctx.fill();
        ctx.beginPath(); ctx.arc(ex - 7, ey + 10, 4, 0, Math.PI * 2); ctx.fill();
      }
      // lashes
      ctx.beginPath(); ctx.moveTo(ex + sx * 18, ey - ry * 0.7); ctx.lineTo(ex + sx * 30, ey - ry * 0.95); ctx.lineWidth = 5; ctx.strokeStyle = "#2B1B3A"; ctx.lineCap = "round"; ctx.stroke();
    }
    // brows
    ctx.beginPath();
    if (mood === "worried") { ctx.moveTo(sx * 64, -28); ctx.quadraticCurveTo(sx * 44, -34, sx * 24, -46); }
    else { ctx.moveTo(sx * 62, -34); ctx.quadraticCurveTo(sx * 44, -44, sx * 26, -38); }
    ctx.lineWidth = 7; ctx.strokeStyle = "#4A2550"; ctx.lineCap = "round"; ctx.stroke();
    // blush
    ctx.beginPath(); ctx.ellipse(sx * 66, 46, 20, 11, 0, 0, Math.PI * 2); ctx.fillStyle = "rgba(255,110,160,0.45)"; ctx.fill();
  }
  // mouth
  if (mood === "happy") {
    ctx.beginPath(); ctx.moveTo(-22, 50); ctx.quadraticCurveTo(0, 82, 22, 50); ctx.closePath(); ctx.fillStyle = "#B8325F"; ctx.fill();
    ctx.beginPath(); ctx.ellipse(0, 64, 9, 5, 0, 0, Math.PI * 2); ctx.fillStyle = "#FF8FB0"; ctx.fill();
  } else {
    const open = 1 + 0.25 * Math.sin(t * 14);
    ctx.beginPath(); ctx.ellipse(0, 60, 15, 13 * open, 0, 0, Math.PI * 2); ctx.fillStyle = "#9C2A52"; ctx.fill();
    ctx.beginPath(); ctx.ellipse(0, 66 + 2 * open, 9, 5, 0, 0, Math.PI * 2); ctx.fillStyle = "#FF8FB0"; ctx.fill();
  }
  // sweat drop
  if (opt.sweat > 0) {
    const sy = -30 + ((t * 40) % 30);
    ctx.save(); ctx.globalAlpha = opt.sweat; ctx.translate(112, sy); ctx.scale(opt.sweat, opt.sweat);

// ---------- curved animated connector ----------
function bezPt(p, k) {
  const [a, b, c, d] = p, u = 1 - k;
  return [u * u * u * a[0] + 3 * u * u * k * b[0] + 3 * u * k * k * c[0] + k * k * k * d[0],
          u * u * u * a[1] + 3 * u * u * k * b[1] + 3 * u * k * k * c[1] + k * k * k * d[1]];
}
function connector(p, amount, t) {
  if (amount <= 0) return;
  const N = 60, pts = [];
  for (let i = 0; i <= N * amount; i++) pts.push(bezPt(p, i / N));
  pts.push(bezPt(p, amount));
  ctx.save(); ctx.lineCap = "round"; ctx.lineJoin = "round";
  const path = () => { ctx.beginPath(); pts.forEach((q, i) => i ? ctx.lineTo(q[0], q[1]) : ctx.moveTo(q[0], q[1])); };
  path(); ctx.shadowColor = C.pink; ctx.shadowBlur = 24; ctx.lineWidth = 16; ctx.strokeStyle = "rgba(255,255,255,0.9)"; ctx.stroke();
  ctx.shadowColor = "transparent";
  path(); ctx.setLineDash([22, 18]); ctx.lineDashOffset = -t * 90; ctx.lineWidth = 7; ctx.strokeStyle = C.purple; ctx.stroke();
  ctx.setLineDash([]);
  // travelling glow dot
  const tip = pts[pts.length - 1];
  drawSparkle(tip[0], tip[1], 26, C.gold, 1, t * 3);
  if (amount >= 1) { const q = bezPt(p, (t * 0.6) % 1); drawSparkle(q[0], q[1], 16, "#FFFFFF", 0.9, t * 4); }
  ctx.restore();
}

    const s2 = fitSize("YAKIN SETIAP HARI! 💜", 92, 960);
    ctx.save(); ctx.translate(540, 1530 + Math.sin(t * 3 + 1) * 6); ctx.scale(h2, h2);
    text3D("YAKIN SETIAP HARI! 💜", 0, 0, s2, { fill: ["#FF9BCB", "#FF3D8F"], stroke: "#FFFFFF", depth: "#9E1450", strokeK: 0.15 });
    ctx.restore();
  }
  const h3 = popScale(t, 14.0, 0.55);
  if (h3 > 0) {
    const pulse = 1 + 0.045 * Math.sin((t - 14) * Math.PI * 2);
    ctx.save(); ctx.translate(540, 1690); ctx.scale(h3 * pulse, h3 * pulse);
    ctx.font = `700 64px ${FONT}`;
    const tw = ctx.measureText("KENALI PRODUK INI ✨").width, bw = tw + 110, bh = 118;
    ctx.shadowColor = "rgba(232,155,30,0.7)"; ctx.shadowBlur = 40; ctx.shadowOffsetY = 10;
    roundRect(-bw / 2, -bh / 2 + 12, bw, bh, bh / 2); ctx.fillStyle = "#C9761A"; ctx.fill();
    ctx.shadowColor = "transparent";
    roundRect(-bw / 2, -bh / 2, bw, bh, bh / 2);
    const gg = ctx.createLinearGradient(0, -bh / 2, 0, bh / 2); gg.addColorStop(0, "#FFE58A"); gg.addColorStop(1, "#FFAE2E");
    ctx.fillStyle = gg; ctx.fill(); ctx.lineWidth = 7; ctx.strokeStyle = "#FFFFFF"; ctx.stroke();
    // shine sweep
    ctx.save(); roundRect(-bw / 2, -bh / 2, bw, bh, bh / 2); ctx.clip();
    const sx = -bw + ((t - 14) % 1.6) / 1.6 * bw * 2.2;
    ctx.beginPath(); ctx.moveTo(sx, -bh); ctx.lineTo(sx + 60, -bh); ctx.lineTo(sx - 10, bh); ctx.lineTo(sx - 70, bh); ctx.closePath();
    ctx.fillStyle = "rgba(255,255,255,0.55)"; ctx.fill(); ctx.restore();
    ctx.textAlign = "center"; ctx.textBaseline = "middle"; ctx.lineJoin = "round";
    ctx.lineWidth = 12; ctx.strokeStyle = "#8A3FD1"; ctx.strokeText("KENALI PRODUK INI ✨", 0, 4);
    ctx.fillStyle = "#FFFFFF"; ctx.fillText("KENALI PRODUK INI ✨", 0, 4);
    ctx.restore();
  }
  starFlashes(t);
}

// ---------- frame dispatcher ----------
window.renderFrame = async function (t) {
  const img = t >= 3.15 ? await loadImg(frameUrl(srcTime(t))) : null;
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.clearRect(0, 0, W, H);
  if (t < 3.15) { sceneHook(t); }
  else if (t < 3.6) {
    // iris transition: mind-map scene grows out of a sparkling circle
    sceneHook(t);
    const k = easeInOutCubic(prog(t, 3.15, 0.45));
    const r = 10 + k * 1250;
    ctx.save(); ctx.beginPath(); ctx.arc(540, 900, r, 0, Math.PI * 2); ctx.clip(); sceneMindmap(t, img); ctx.restore();
    ctx.save(); ctx.lineWidth = 26; ctx.strokeStyle = "rgba(255,255,255,0.9)"; ctx.shadowColor = C.pink; ctx.shadowBlur = 40;
    ctx.beginPath(); ctx.arc(540, 900, r, 0, Math.PI * 2); ctx.stroke(); ctx.restore();
    for (let i = 0; i < 16; i++) { const a = i * Math.PI / 8 + t * 3; drawSparkle(540 + Math.cos(a) * r, 900 + Math.sin(a) * r, 26, i % 2 ? C.gold : C.pink, 1, t * 4); }
  }
  else if (t < 10.0) sceneMindmap(t, img);
  else sceneFinal(t, img);
  // whoosh streaks on transitions
  for (const wt of TL.sfx.whoosh) {
    const k = (t - wt) / 0.35;
    if (k < 0 || k > 1) continue;
    ctx.save(); ctx.globalAlpha = Math.sin(k * Math.PI) * 0.8;
    for (let i = 0; i < 7; i++) {
      const y = 200 + i * 250, x = -400 + k * 1900 - (i % 3) * 120;
      const lg = ctx.createLinearGradient(x - 380, 0, x, 0); lg.addColorStop(0, "rgba(255,255,255,0)"); lg.addColorStop(1, "rgba(255,255,255,0.95)");
      ctx.fillStyle = lg; roundRect(x - 380, y, 380, 14 + (i % 2) * 8, 10); ctx.fill();
    }
    ctx.restore();
  }
};
window.ready = (async () => {
  TL = await (await fetch("timeline.json")).json();
  await document.fonts.load(`700 80px "Fredoka"`);
  await document.fonts.load(`80px "Noto Color Emoji"`, "😱💜✨");
  await document.fonts.ready;
  return true;
})();
</script>
